# /etc/nginx/sites-available/tnajem — Tnajem production (DEPLOY.md §6)
# APP_DIR = /var/www/tnajem. certbot --nginx adds the 443/TLS lines to this file.
# Cloudflare real client IPs come from /etc/nginx/conf.d/cloudflare-realip.conf.

server {
  listen 80;
  listen [::]:80;
  server_name tnajem.com www.tnajem.com;

  # Next's server-action limit (12mb) is the binding one; keep nginx above it.
  client_max_body_size 15M;

  # ── gzip (Node does not compress) ─────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml+rss image/svg+xml application/manifest+json;

  # ── Content-hashed build assets: served by nginx from disk, cached forever ─
  location /_next/static/ {
    alias /var/www/tnajem/apps/web/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Brand files: not hashed → short TTL ───────────────────────────────────
  location ~ ^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|logo\.png|logo-white\.png|logo\.webp|logo-white\.webp|og\.png)$ {
    root /var/www/tnajem/apps/web/public;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # ── Everything else → Next (web, :3000). The API (:4000) is NEVER exposed. ─
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
